camera_node:
  ros__parameters: {source: /dev/video0, width: 1280, height: 720, fps: 30}
lane_node:
  ros__parameters: {backend: om, width: 512, height: 256, min_pixels: 80, device_id: 0}
yolo_node:
  ros__parameters: {backend: om, size: 640, confidence: 0.35, iou: 0.45, device_id: 0}
decision_node:
  ros__parameters:
    control_hz: 20.0
    lane_timeout_s: 0.30
    detection_timeout_s: 0.50
    detection_confidence: 0.35
    action_cooldown_s: 2.0
    normal_rpm: 80.0
    crawl_rpm: 35.0
    turn_rpm: 70.0
    turn_left_duration_s: 0.55
    turn_right_duration_s: 0.55
    turnaround_duration_s: 1.10
    park_duration_s: 1.20
chassis_node:
  ros__parameters:
    port: /dev/ttyUSB0
    baudrate: 115200
    timeout_s: 0.30
    dry_run: true
    motor_signs: [-1, -1, 1, 1]

