[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-smart-car"
version = "1.0.0"
description = "Shared perception, decision and chassis stack for an Atlas 200I DK A2 smart car"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<2.0",
  "opencv-python>=4.7,<4.12",
  "PyYAML>=6.0",
  "pyserial>=3.5",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.16"]
train = ["torch>=2.0", "torchvision>=0.15", "onnx>=1.14", "pandas>=1.5", "matplotlib>=3.7", "tqdm>=4.65"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
smartcar = "smartcar_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]

