dataset:
  image_root: /path/to/lanenet/images
  binary_mask_root: /path/to/lanenet/binary_masks
  instance_mask_root: /path/to/lanenet/instance_masks
  split_csv: /path/to/lanenet/splits.csv
model: {input_width: 512, input_height: 256, embedding_dim: 4, binary_classes: 2, base_channels: 32, normalize: minus_one_to_one}
loss: {binary_mode: ce, embedding_weight: 0.1, hnet_weight: 0.001, lane_class_weight: 3.0}
augment: {enabled: true, horizontal_flip_prob: 0.5, brightness: 0.12, contrast: 0.12}
train: {epochs: 80, batch_size: 16, workers: 4, learning_rate: 0.0001, weight_decay: 0.0002, lr_step_size: 20, lr_gamma: 0.5, seed: 42, save_period: 10, preview_period: 5, preview_count: 4, output_dir: models/lane/runs}

